name: Photo Advisor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check --output-format=github app scripts tests
      - name: Test Python
        run: python -m pytest -q
      - name: Test pilot presentation
        run: node --test tests/pilot_feedback.test.cjs
